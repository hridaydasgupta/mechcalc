<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Resultant Force Calc</title>
         <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
        <script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <link rel="stylesheet" href="./css/bootstrap.min.css">
        <link rel="stylesheet" href="./css/resultantForce.css">
    </head>
    <body>
        <div class="container-fluid">
            <button class="btn btn btn-outline-light backbtn1 d-md-none d-block" onclick="window.location.href='./index.html'">🔙</button>
            <div class="row justify-content-center align-items-center h-100">
                <div class="col-12 col-xl-5 col-lg-6 col-md-8 col-sm-10">

                    <div class="card mb-4 p-0 mt-5">
                        <div class="card-body p-3 position-relative">
                            <button class="btn btn btn-outline-light backbtn d-none d-md-block" onclick="window.location.href='./index.html'">🔙</button>
                            <h3 class="heading">RESULTANT FORCE CALC</h3>
                        </div>
                    </div>
                    
                    <div class="card mb-4" id="inputbox">
                        <div class="card-body pt-4 pb-2">
                            <div class="desc"><h6>Resultant Force Calculator for Coplanar Concurrent Force System</h6></div>
                            <div class="row">
                                <div class="col-12 col-md-7 d-flex add-force">
                                    <input type="number" class="form-control form-control-sm font-weight-bold h-100 " id="force-count" value="2">
                                    <button class="btn btn-primary btn-sm" style="white-space: nowrap;" onclick="addForces()">ADD FORCES</button>
                                </div>
                                <div class="col-12 col-md-5 mt-3 mt-sm-0">
                                    <button class="btn btn-sm btn-success btn-lg w-100" id="findbtn" onclick="calculateResultant()"><b>CALCULATE RESULTANT</b></button>
                                </div>
                                <div class="col-12 mt-2 p-2">
                                    <div class="card" id="forces">
                                        
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card mb-4" id="result">
                    </div>

                </div>
            </div>
        </div>
        <script src="./js/resultantForce.js"></script>       
    </body>
</html>
