<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lami's Theorem Calc</title>
        <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
        <script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
        </script>
        <link rel="stylesheet" href="./css/bootstrap.min.css">
        <link rel="stylesheet" href="./css/lamisTheorem.css">
    </head>
    <body>
        <div class="container-fluid">
            <button class="btn btn btn-outline-light backbtn1 d-md-none d-block" onclick="window.location.href='./index.html'">🔙</button>
            <div class="row justify-content-center align-items-center h-100">
                <div class="col-12 col-xl-5 col-lg-6 col-md-8 col-sm-10">

                    <div class="card mb-4 p-0 mt-5">
                        <div class="card-body p-3 position-relative">
                            <button class="btn btn btn-outline-light backbtn d-none d-md-block" onclick="window.location.href='./index.html'">🔙</button>
                            <h3 class="heading">LAMI'S THEOREM CALC</h3>
                        </div>
                    </div>
                    
                    <div class="card mb-4" id="inputbox">
                        <div class="card-body p-md-3 p-2">
                            <!-- <div class="desc"></div> -->
                            <div class="row">
                                <div class="col-12">
                                    <div class="bg-info d-flex p-1 justify-content-center align-items-center text-white rounded">
                                        <label for="knownForce" class="text-nowrap m-0 ml-3">Known Force (F1) : </label>
                                        <input type="number" class="form-control form-control-sm ml-2 ml-sm-3" style="width: 120px;" id="knownForce" value="">
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="bg-info d-flex p-1 justify-content-center align-items-center text-white rounded my-2">
                                        <label for="angleOppositeF1" class="text-nowrap m-0 ml-1">Angle Opposite to Known Force : </label>
                                        <input type="number" placeholder="∠α" class="form-control form-control-sm ml-2 ml-sm-3 angle360" id="angleOppositeF1" value="">
                                        <span>°</span>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="bg-info d-flex p-1 justify-content-center align-items-center text-white rounded">
                                        <label for="angleOppositeF2" class="text-nowrap m-0 ml-1">Angle Opposite to Unknown Force F2 : </label>
                                        <input type="number" placeholder="∠β" class="form-control form-control-sm ml-2 ml-sm-3 angle360" id="angleOppositeF2" value="">
                                        <span>°</span>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="bg-info d-flex p-1 justify-content-center align-items-center text-white rounded mt-2">
                                        <label for="angleOppositeF3" class="text-nowrap m-0 ml-1">Angle Opposite to Unknown Force F3 : </label>
                                        <input type="number" placeholder="∠γ" class="form-control form-control-sm ml-2 ml-sm-3 angle360" id="angleOppositeF3" value="">
                                        <span>°</span>
                                    </div>
                                </div>
                                <div class="col-12 mt-4">
                                    <button class="btn btn-success btn-block font-weight-light" onclick="calculateForces()">CALCULATE UNKNOWN FORCES</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card mb-4" id="result">
                    </div>
                    <script src="./js/lamisTheorem.js"></script>
                </div>
            </div>
        </div>
    </body>
</html>
